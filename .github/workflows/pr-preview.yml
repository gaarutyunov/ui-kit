name: Storybook PR Preview

# Build a Storybook for each pull request and deploy it to
# https://gaarutyunov.github.io/ui-kit/pr-preview/pr-<N>/
# A sticky comment with the link is posted on the PR. The preview is removed
# automatically when the PR is closed.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip forked PRs: they have no write token, so the deploy step would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      - name: Build Storybook
        if: github.event.action != 'closed'
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /ui-kit/pr-preview/pr-${{ github.event.number }}/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./storybook-static
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto # deploy on open/sync, remove on close
