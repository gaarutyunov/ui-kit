name: Deploy docs site

# Assemble the buildless docs site and publish it to the root of the gh-pages
# branch on every push to main. PR previews live in pr-preview/ on the same
# branch, so we keep_files to avoid wiping them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies to install — the site is plain ES modules. We only need
      # Node to run the tiny copy script that assembles dist/.
      - name: Build site
        run: node scripts/build.mjs

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true # preserve pr-preview/* directories
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: docs site from ${{ github.sha }}"
